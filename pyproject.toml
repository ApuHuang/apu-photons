[project]
name = "apu-photons"
dynamic = ["version"]
description = "APU Photons (Astrophotography Photons Utility)：天文攝影校正、對齊、疊圖"
requires-python = ">=3.10"
dependencies = ["astropy>=6.0", "numpy>=1.26", "photutils>=1.12", "scipy>=1.12", "rawpy>=0.25", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest"]
exe = ["pyinstaller>=6.0"]
gpu = ["cupy-cuda12x[ctk]"]  # NVIDIA 顯示卡；沒有就自動用 CPU

[project.scripts]
apu-photons = "apu_photons.cli:main"

[project.gui-scripts]
apu-photons-gui = "apu_photons.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "apu_photons.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
apu_photons = ["assets/*.ico", "assets/*.png"]
